<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - GT8167</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:10px}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px}
h2{color:green;text-align:center}
.btn{background:green;color:white;padding:12px 20px;border:none;border-radius:6px;font-weight:bold}
input{width:95%;padding:12px;border:2px solid #ccc;border-radius:6px}
.user{border-left:4px solid green;padding:10px;margin:8px 0;background:#f1f8e9}
</style>
</head>
<body>
<h2>🌱 Admin - GT8167 System</h2>
<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input type="text" id="pass" placeholder="Password type karo">
<button class="btn" onclick="login()" style="margin-top:10px">Login</button>
<p>Pass: admin123 (small letters)</p>
</div>

<div id="main" style="display:none">
<div class="card">
<h3>📊 Live Stats</h3>
<p>Total: <b id="total">0</b></p>
<p>ID: <b id="myid" style="color:green;font-size:20px">-</b></p>
<p>Balance: ₹<b id="mybal" style="font-size:24px">0</b></p>
<button class="btn" onclick="load()">🔄 Refresh</button>
</div>
<div class="card"><h3>💰 Withdraw</h3><div id="wList"></div></div>
<div class="card"><h3>🔍 Debug</h3><div id="allData" style="background:#eee;padding:10px;font-size:13px"></div>
<button class="btn" style="background:red;margin-top:10px" onclick="localStorage.clear();alert('Clear');load()">Clear All</button>
</div>
</div>

<script>
function login(){
 let p = document.getElementById('pass').value.trim().toLowerCase();
 // trim + lowercase - space ની ભૂલ નહિ આવે
 if(p==='admin123'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('main').style.display='block';
  load();
 }else{
  alert('Password: admin123 - નાના અક્ષર માં, Space વગર લખો. તમે લખ્યું: ['+p+']');
 }
}
function load(){
 let myId = localStorage.getItem('gt_myId') || localStorage.getItem('my_code') || 'GT8167';
 let myBal = localStorage.getItem('gt_bal') || localStorage.getItem('my_bal') || '0';
 document.getElementById('myid').innerText=myId;
 document.getElementById('mybal').innerText=myBal;
 document.getElementById('total').innerText=localStorage.length;
 let w = localStorage.getItem('gt_withdraw')||'[]';
 document.getElementById('wList').innerText=w;
 let all=''; for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i); all+=k+': '+localStorage.getItem(k)+'<br>';}
 document.getElementById('allData').innerHTML=all;
}
</script>
</body>
</html>
