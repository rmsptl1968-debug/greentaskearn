<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Task - Admin Panel</title>
<style>
body{font-family:Arial;background:#f0f8f0;margin:0;padding:15px}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 5px #0001;margin-bottom:15px}
h2{color:green;text-align:center}
button{background:green;color:white;padding:10px 15px;border:none;border-radius:5px;cursor:pointer}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px}
.user-box{border-bottom:1px solid #eee;padding:10px 0}
</style>
</head>
<body>
<h2>🌱 Green Task - ADMIN</h2>
<div class="card">
<h3>Login</h3>
<input type="password" id="pass" placeholder="Admin Password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">
<div class="card">
<h3>All Users Data</h3>
<div id="users"></div>
<button onclick="clearAll()">Clear All Data</button>
</div>
<div class="card">
<h3>Withdrawal Requests</h3>
<div id="withdraw"></div>
</div>
</div>

<script>
function login(){
if(document.getElementById('pass').value==='admin123'){
document.getElementById('panel').style.display='block';
loadData();
}else{alert('Wrong Password!')}
}
function loadData(){
let users = JSON.parse(localStorage.getItem('gt_users')||'[]');
let html='';
users.forEach((u,i)=>{
html+=`<div class="user-box"><b>${u.name||'User'+i}</b> - ₹${u.balance||0} - Refer: ${u.refer||0} Users <br> Mobile: ${u.mobile||''}</div>`;
});
document.getElementById('users').innerHTML=html||'No Users Yet';
let w = JSON.parse(localStorage.getItem('gt_withdraw')||'[]');
let wh='';
w.forEach(x=>{wh+=`<div class="user-box">${x.mobile} - ₹${x.amount} - ${x.status}</div>`});
document.getElementById('withdraw').innerHTML=wh||'No Request';
}
function clearAll(){if(confirm('Sure?')){localStorage.clear();alert('Cleared');loadData()}}
</script>
</body>
</html>
