<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Task Earn</title>
<style>
body{font-family:system-ui;background:#f0fdf4;margin:0}
.header{background:#16a34a;color:#fff;padding:20px;text-align:center;font-weight:900;font-size:22px}
.card{background:#fff;margin:14px;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.task{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1.5px solid #dcfce7;border-radius:12px;margin-bottom:12px}
.btn{background:#16a34a;color:#fff;border:none;padding:11px 20px;border-radius:24px;font-weight:900}
.btn-gold{background:#f59e0b}.balance{font-size:30px;font-weight:900;color:#16a34a}
.native-wrap{background:#fff;margin:14px;border-radius:12px;padding:8px;border:1px solid #eee}
</style>
<script data-cfasync="false" src="https://afders.org/1/d3d99431adc338a4df304d497bf2d249"></script>
</head>
<body>
<div class="header">🌿 GREEN TASK EARN - ₹500 Daily</div>
<div class="card">Balance: <span class="balance">₹<span id="bal">0</span></span> <button class="btn btn-gold" onclick="withdraw()">WITHDRAW</button></div>
<div class="native-wrap">
<script async="async" data-cfasync="false" src="https://bicea.org/21/c40e448bbdab3d4306bdef7d37b4fb29"></script>
<div id="container-c40e448bbdab3d4306bdef7d37b4fb29"></div>
</div>
<div class="card">
<div class="task"><div><b>💎 Special Offer BEST</b><br><small>+ ₹40</small></div><button class="btn btn-gold" onclick="doTask()">EARN NOW</button></div>
<div class="task"><div><b>📱 App Install</b><br><small>+ ₹25</small></div><button class="btn" onclick="doTask()">START</button></div>
<div class="task"><div><b>🌐 Visit Site</b><br><small>+ ₹15</small></div><button class="btn" onclick="doTask()">VISIT</button></div>
</div>
<script>
const SMARTLINK = "https://arwf.org/4/71c629698b098809841a9971deed43dc";
let bal = parseInt(localStorage.getItem('gt_all_bal')||'0');
document.getElementById('bal').innerText = bal;
function doTask(){
  bal+=25; localStorage.setItem('gt_all_bal',bal);
  document.getElementById('bal').innerText=bal;
  window.open(SMARTLINK,'_blank');
  setTimeout(()=>window.open(SMARTLINK,'_blank'),1000);
}
function withdraw(){
  if(bal<100){ alert('Min ₹100 Need ₹'+(100-bal)); doTask(); return; }
  alert('Withdraw ₹'+bal+' Done!'); window.open(SMARTLINK,'_blank');
}
</script>
<script data-cfasync="false" src="https://bicea.org/14/12ea438ebd8b91048ace7cbd4fbfa34f"></script>
</body>
</html>
