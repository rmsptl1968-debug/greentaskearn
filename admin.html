<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#fef3c7;margin:0;padding:15px}
.card{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-size:16px;margin-top:10px}
.box{display:flex;justify-content:space-between;background:#dcfce7;padding:12px;border-radius:10px;margin:10px 0}
.hidden{display:none}
.wBox{background:#fffbeb;border:2px solid #f59e0b;padding:12px;border-radius:10px;margin:10px 0}
.userBox{background:#f0fdf4;border:1px solid #16a34a;padding:12px;border-radius:10px;margin:10px 0}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<div class="card">
<div id="loginDiv">
<h2 style="text-align:center;color:#d97706">🔐 Admin Panel</h2>
<p style="text-align:center;font-size:14px">Fakt Ramesh Sir Mate!</p>
<input id="adminPass" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
<p style="text-align:center;font-size:12px"><a href="index.html">Back to App</a></p>
</div>
<div id="adminDiv" class="hidden">
<h2 style="text-align:center;color:#d97706">👑 Admin Panel</h2>
<div class="box"><b>Total Users:</b><b id="totalUsers">0</b></div>
<div class="box"><b>Pending Withdraw:</b><b id="totalPending">₹0</b></div>
<div class="box"><b>Total Paid:</b><b id="totalPaid">₹0</b></div>
<h3>💰 Withdraw Requests - Pending</h3>
<div id="pendingList"><p class="small">Haji koi Request nathi!</p></div>
<h3>✅ Paid History</h3>
<div id="paidList"><p class="small">Haji koi Payment nathi!</p></div>
<h3>👥 All Users List</h3>
<div id="userList"><p class="small">Haji koi User nathi!</p></div>
<button onclick="loadData()" style="background:#f59e0b">🔄 Refresh Karo</button>
<button onclick="adminLogout()" style="background:#ef4444">Logout</button>
</div>
</div>
<script>
let ADMIN_PASS = "ramesh123";
function adminLogin(){
let p = document.getElementById("adminPass").value.trim();
if(p == ADMIN_PASS){
localStorage.setItem("g_admin","yes");
showAdmin();
} else {
alert("Khoto Password! Password che: ramesh123");
}
}
window.onload = () => {
if(localStorage.getItem("g_admin")=="yes") showAdmin();
};
function showAdmin(){
document.getElementById("loginDiv").classList.add("hidden");
document.getElementById("adminDiv").classList.remove("hidden");
loadData();
}
function loadData(){
let users = JSON.parse(localStorage.getItem("g_users")||"[]");
let reqs = JSON.parse(localStorage.getItem("g_withdraw")||"[]");
document.getElementById("totalUsers").innerText = users.length;
let pending = reqs.filter(r=>r.status=="Pending");
let paid = reqs.filter(r=>r.status=="Paid");
let pendingTotal = 0;
pending.forEach(r=> pendingTotal += Number(r.amount)||0);
document.getElementById("totalPending").innerText = "₹"+pendingTotal;
let paidTotal = 0;
paid.forEach(r=> paidTotal += Number(r.amount)||0);
document.getElementById("totalPaid").innerText = "₹"+paidTotal;
let pHtml = "";
if(pending.length==0) pHtml = "<p class='small'>Haji koi Request nathi!</p>";
else pending.forEach((r,i)=>{
pHtml += "<div class='wBox'><b>"+r.name+" - ₹"+r.amount+"</b><br><span class='small'>Mobile: "+r.mobile+"<br>UPI: <b>"+r.upi+"</b><br>Date: "+r.date+"</span><br><button onclick='markPaid("+i+")' style='background:#0284c7'>✅ Pay Kari Didhu - Paid Karo</button></div>";
});
document.getElementById("pendingList").innerHTML = pHtml;
let paidHtml = "";
if(paid.length==0) paidHtml
