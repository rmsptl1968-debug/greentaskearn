<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
</head>
<body style="font-family:Arial;background:#e8f5e9;padding:15px">
<h2 style="color:green;text-align:center">🌱 Green Task - Admin</h2>

<div id="login">
<div style="background:white;padding:20px;border-radius:10px">
<h3>Admin Login</h3>
<input id="p" style="width:90%;padding:12px" placeholder="admin123">
<br><br>
<button onclick="go()" style="background:green;color:white;padding:12px 25px;border:none;border-radius:5px;font-size:18px">LOGIN</button>
</div>
</div>

<div id="main" style="display:none">
<div style="background:white;padding:15px;border-radius:10px;margin-bottom:10px">
<h3>📊 Dashboard</h3>
ID: <b>GT8167</b><br>
Balance: ₹<b id="b">0</b><br><br>
<button onclick="location.reload()" style="background:green;color:white;padding:10px">Refresh</button>
</div>

<div style="background:white;padding:15px;border-radius:10px;margin-bottom:10px">
<h3>👥 Users Menu</h3>
<div style="background:#f1f8e9;padding:10px">GT8167 - Active User</div>
</div>

<div style="background:white;padding:15px;border-radius:10px;margin-bottom:10px">
<h3>🔗 7 Level Menu</h3>
<div style="background:#f1f8e9;padding:10px">Level 1-7 Team List Here</div>
</div>

<div style="background:white;padding:15px;border-radius:10px;margin-bottom:10px">
<h3>📝 Tasks Menu</h3>
<div style="background:#f1f8e9;padding:10px">Task 1,2,3 Control</div>
</div>

<div style="background:white;padding:15px;border-radius:10px;margin-bottom:10px">
<h3>💰 Withdraw Menu</h3>
<div style="background:#f1f8e9;padding:10px">Withdraw Requests</div>
</div>

<div style="background:white;padding:15px;border-radius:10px">
<h3>⚙️ Settings Menu</h3>
<div style="background:#f1f8e9;padding:10px">Settings + Clear Data</div>
<button onclick="localStorage.clear();alert('Cleared')" style="background:red;color:white;padding:10px;margin-top:10px">Clear All</button>
</div>
</div>

<script>
function go(){
var v=document.getElementById('p').value.trim();
if(v=='admin123'||v=='Admin123'||v=='ADMIN123'){
document.getElementById('login').style.display='none';
document.getElementById('main').style.display='block';
var bal=localStorage.getItem('gt_bal')||'0';
document.getElementById('b').innerText=bal;
}else{alert('Password admin123 likho - apne likha: '+v)}
}
</script>
</body>
</html>
