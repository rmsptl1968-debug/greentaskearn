<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Task Earn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#e8f5e9}
.top{background:#2e7d32;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:18px}
.box{background:#fff;margin:15px;padding:20px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #0001}
.btn{width:100%;padding:14px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="top">🌿 GREEN TASK EARN</div>
<div class="box">
<div>Your Balance</div>
<div style="font-size:36px;color:#2e7d32;font-weight:bold">₹<span id="b">0</span></div>
<br>
<button class="btn" onclick="add()">✅ COMPLETE TASK + ₹25</button>
<br><br>
<button class="btn" style="background:#ff9800" onclick="alert('Min Withdraw ₹100')">WITHDRAW</button>
</div>
<script>
let bal = parseInt(localStorage.getItem('gt_bal')||'0');
document.getElementById('b').innerText = bal;
function add(){
bal+=25;
localStorage.setItem('gt_bal',bal);
document.getElementById('b').innerText=bal;
alert('Task Completed! ₹25 Added');
}
</script>
</body>
</html>
