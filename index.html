<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREEN TASK EARN</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}body{background:#f2f2f2;padding:5px}
.head{background:linear-gradient(90deg,#0a8a00,#00c853);padding:14px;border-radius:10px;text-align:center;color:white}
.box{background:white;border:2px solid #00c853;border-radius:10px;padding:12px;margin:8px 0}
.in{width:100%;padding:12px;margin:6px 0;border:2px solid #666;border-radius:7px;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-weight:bold;color:white;cursor:pointer;font-size:15px;margin:6px 0}
.g{background:#00c853}.r{background:red}.d{background:#222}.b{background:#2962ff}
.hide{display:none}
.success{background:#ffeb3b;border:3px solid green;border-radius:10px;padding:14px;text-align:center;margin:8px 0}
.ref{background:white;border:2px dashed orange;padding:10px;border-radius:7px;word-break:break-all;font-size:13px;font-weight:bold;margin:6px 0}
.ad{border:2px solid #00c853;border-radius:10px;padding:8px;background:white;margin:8px 0}
.ad img{width:100%;border-radius:6px}
#videoModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;padding:10px}
#videoModal iframe{width:100%;max-width:500px;height:280px;border-radius:10px}
</style></head><body>

<div id="videoModal">
<iframe id="ytPlayer" src="" allowfullscreen></iframe>
<div style="color:white;margin:10px;font-size:16px;">⏳ <span id="timer">10</span> સેકન્ડ જુઓ - Task ચાલુ છે...</div>
<button id="earnBtn" class="btn g hide" style="max-width:300px;" onclick="completeTask()">✅ Task Complete - Rs.5 મેળવો</button>
<button class="btn r" style="max-width:300px;" onclick="closeVideo()">❌ બંધ કરો</button>
</div>

<div class="head"><h1>GREEN TASK EARN</h1><div style="font-size:11px;">100% LEGAL | MSME | Rs.201 STARTER</div></div>

<div id="okBox" class="success hide">
<h2 style="color:green;">✅ LOGIN થઈ ગયું!</h2>
<div id="okName"></div>
<div class="ref" id="okRef"></div>
<button class="btn g" onclick="copyRef()">📋 Refer Link Copy</button>
<button class="btn" style="background:#25D366;" onclick="shareWA()">📲 WhatsApp Share</button>
<div id="okTeam" style="font-size:12px;background:white;padding:8px;border-radius:6px;margin-top:8px;text-align:left;"></div>
<div style="font-size:14px;font-weight:bold;color:green;margin-top:8px;">💰 Total Earn: Rs.<span id="earnTotal">0</span></div>
<button class="btn d" onclick="logout()">Logout</button>
</div>

<div id="authBox" class="box">
<div style="text-align:center;font-weight:bold;color:green;font-size:16px;">🔐 એક જ ક્લિક માં Start</div>
<input id="sName" class="in" placeholder="નામ" value="RAMESHKUMAR GIRDHARLAL PATEL">
<input id="sMob" class="in" type="tel" placeholder="Mobile 9904078804" value="9904078804">
<input id="sPass" class="in" type="password" placeholder="Password લખો - 123456">
<input id="sRef" class="in" placeholder="Refer Code (Optional)">
<button class="btn g" onclick="oneClick()">✅ Start કરો</button>
</div>

<div style="background:#f0fff0;border:2px solid green;border-radius:10px;padding:10px;margin:8px 0;font-size:12px;"><b>🌟 Rs.201 PLAN 🌟</b> L1=25 L2=20 L3=40 Super Promoter L4=20 L5=20 | Total 201</div>

<div id="adsBox"></div>

<script>
let curVid='';let earn=parseInt(localStorage.getItem('gte_earn')||'0');
function getUsers(){try{return JSON.parse(localStorage.getItem('gte_final_users')||'{}')}catch(e){return {}}}
function saveUsers(u){localStorage.setItem('gte_final_users',JSON.stringify(u))}
let users=getUsers();let cur=localStorage.getItem('gte_final_cur');

function oneClick(){
 let n=document.getElementById('sName').value.trim();
 let m=document.getElementById('sMob').value.trim().replace(/[^0-9]/g,'').slice(-10);
 let p=document.getElementById('sPass').value.trim();
 let r=document.getElementById('sRef').value.trim().replace(/[^0-9]/g,'').slice(-10);
 if(!n||m.length!=10||!p){alert('નામ + 10 આંકડા Mobile + Password લખો');return;}
 users=getUsers();
 if(users[m]){
   if(users[m].pass!==p){alert('Password ખોટો! સાચો: '+users[m].pass);return;}
   cur=m;localStorage.setItem('gte_final_cur',cur);showOk();
 }else{
   users[m]={name:n,mobile:m,pass:p,refBy:r,team:[],join:new Date().toLocaleDateString()};
   if(r&&users[r]){users[r].team.push(m);}
   saveUsers(users);cur=m;localStorage.setItem('gte_final_cur',cur);showOk();
   alert('🎉 SIGN UP થઈ ગયું! ID:'+m);
 }
}
function showOk(){
 users=getUsers();if(!cur||!users[cur])return;
 let u=users[cur];
 document.getElementById('authBox').classList.add('hide');
 document.getElementById('okBox').classList.remove('hide');
 document.getElementById('okName').innerHTML='Welcome <b>'+u.name+'</b><br>ID:'+u.mobile;
 document.getElementById('okRef').innerText=location.origin+location.pathname+'?ref='+u.mobile;
 document.getElementById('okTeam').innerHTML='Team:'+u.team.length+' | Rs.'+u.team.length*25;
 document.getElementById('earnTotal').innerText=earn;
 loadAds();
}
function logout(){localStorage.removeItem('gte_final_cur');location.reload();}
