<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Task Earn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#e8f5e9}
.top{background:#2e7d32;color:#fff;padding:15px;text-align:center;font-weight:bold}
.box{background:#fff;margin:15px;padding:20px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #0001}
.btn{width:100%;padding:14px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px}
.btn-watch{background:#1976d2}
.btn:disabled{background:#aaa}
#timer{margin-top:10px;color:#d32f2f;font-weight:bold;display:none}
</style>
</head>
<body>
<div class="top">🌿 GREEN TASK EARN - WATCH & EARN ₹1</div>
<div class="box">
<div>Your Balance</div>
<div style="font-size:36px;color:#2e7d32;font-weight:bold">₹<span id="b">0</span></div>

<button class="btn btn-watch" id="watchBtn" onclick="watchAd()">▶️ WATCH AD + ₹1</button>
<div id="timer">Please wait <span id="sec">10</span> sec... Don't close</div>

<button class="btn" style="background:#ff9800" onclick="alert('Min ₹100 for Withdraw - Contact Admin')">WITHDRAW</button>
</div>

<script>
let bal = parseInt(localStorage.getItem('gt_bal')||'0');
document.getElementById('b').innerText = bal;

function watchAd(){
// YOUR ADSTERRA SMARTLINK
window.open('https://asiafilm.org/4/9dac62fd7ae9732b34ebc01618e5d030','_blank');

let btn = document.getElementById('watchBtn');
let timerDiv = document.getElementById('timer');
let secSpan = document.getElementById('sec');
btn.disabled = true;
timerDiv.style.display='block';
let s=10;
let intv = setInterval(()=>{
s--;
secSpan.innerText=s;
if(s<=0){
clearInterval(intv);
bal+=1;
localStorage.setItem('gt_bal',bal);
document.getElementById('b').innerText=bal;
alert('✅ Task Complete! ₹1 Added to Balance');
btn.disabled=false;
timerDiv.style.display='none';
secSpan.innerText=10;
}
},1000);
}
</script>
</body>
</html>
