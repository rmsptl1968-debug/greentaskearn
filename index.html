function withdraw(){var upi=document.getElementById("upi").value; var amt=document.getElementById("amt").value; if(!upi||!amt){alert("UPI અને Amount ભરો");return;} if(amt<100){alert("Min ₹100");return;} if(amt>earn){alert("પૈસા ઓછા છે. Total: "+fmt(earn));return;} document.getElementById("wMsg").innerText="Withdraw Request મોકલાઈ ગઈ!"; document.getElementById("aWithdraw").innerText="1"; if(db) db.collection("withdrawals").add({mobile:currentMobile,name:currentName,upi:upi,amt:amt,time:new Date().toISOString()}); document.getElementById("livePayList").innerHTML="👤 "+currentName+" - ₹"+amt+" - "+upi;}
function addBizAd(){var b=document.getElementById("bizName").value; var pr=document.getElementById("bizPrice").value; if(!b){alert("વેપારીનું નામ નાખો");return;} document.getElementById("bizMsg").innerText="✅ "+b+" ની Ad ઉમેરાઈ ગઈ! Price: "+pr;}
try{var params=new URLSearchParams(window.location.search); var r=params.get("ref"); if(r){document.getElementById("referBy").value=r;}}catch(e){}
</script>
