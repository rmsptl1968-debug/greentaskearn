<!DOCTYPE html><html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Task Earn</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#f2f2f2;padding:4px}
.green-head{background:linear-gradient(90deg,#0a8a00,#00c853);padding:14px;border-radius:10px;text-align:center;color:white}
.plan-box{background:#f8fff8;border:2px solid #2e7d32;border-radius:10px;padding:10px;margin:8px 0;font-size:11px;line-height:17px}
.admin-box{background:white;border:2px dashed red;border-radius:10px;padding:10px;margin:8px 0}
.input{width:100%;padding:11px;margin:5px 0;border:1px solid #999;border-radius:6px;font-size:13px}
.btn{width:100%;padding:12px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-green{background:#00c853;color:white}
.btn-red{background:red;color:white}
.btn-dark{background:#333;color:white}
.tab-row{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;padding:10px;text-align:center;background:#ddd;border-radius:6px;font-weight:bold;cursor:pointer}
.tab.active{background:#00c853;color:white}
.hidden{display:none}
.success-box{background:yellow;border:3px solid green;border-radius:10px;padding:12px;margin:8px 0;text-align:center}
.ref-box{background:#fff9c4;border:2px dashed orange;padding:10px;border-radius:8px;word-break:break-all;font-size:12px;margin:8px 0}
.ad-card{background:white;border:2px solid #00c853;border-radius:10px;padding:8px;margin:8px 0}
</style></head><body>

<div class="green-head"><h1>GREEN TASK EARN</h1><p style="font-size:10px;">100% LEGAL | MSME REGISTERED</p></div>

<div id="loginSuccess" class="success-box hidden">
<h2 style="color:green;">✅ LOGIN SUCCESS!</h2>
<p id="welcomeMsg" style="font-size:13px;margin:6px 0;"></p>
<div class="ref-box" id="myRefLink" style="font-weight:bold;"></div>
<button class="btn btn-green" style="padding:8px;margin:4px 0;" onclick="copyRef()">📋 Refer Link Copy</button>
<button class="btn" style="background:#25D366;color:white;padding:8px;" onclick="shareWA()">📲 WhatsApp Share</button>
<div id="myTeam" style="font-size:11px;margin-top:8px;text-align:left;background:white;padding:6px;border-radius:6px;"></div>
<button class="btn btn-dark" style="padding:8px;margin-top:8px;" onclick="doLogout()">Logout</button>
</div>

<div id="authArea">
<div class="tab-row"><div class="tab active" id="tLogin" onclick="switchTab('login')">🔐 Login</div><div class="tab" id="tSignup" onclick="switchTab('signup')">📝 Sign Up</div></div>
<div id="loginBox"><input id="loginId" class="input" placeholder="Mobile No - 9904078804"><input id="loginPass" type="password" class="input" placeholder="Password"><button class="btn btn-green" onclick="doLogin()">🔐 Login કરો</button></div>
<div id="signupBox" class="hidden"><input id="sName" class="input" placeholder="તમારું નામ - RAMESHKUMAR"><input id="sMobile" class="input" placeholder="Mobile No - ID બનશે"><input id="sPass" type="password" class="input" placeholder="Password - યાદ રહે એવો"><input id="sRef" class="input" placeholder="Referral Code (Optional)"><button class="btn btn-green" onclick="doSignup()">📝 Sign Up કરો</button></div>
</div>

<div class="plan-box"><div style="text-align:center;color:green;font-weight:bold;">🌟 Rs.201 STARTER PLAN 🌟</div>
Level 1=25 Direct, L2=20, L3=40 <span style="color:red;">Super Promoter</span>, L4=20, L5=20<br><b>Total Team Bonus=125</b> | Admin=30 | Profit=46 | <b style="color:green;">Total=201</b></div>

<div class="admin-box"><div style="color:red;text-align:center;font-weight:bold;font-size:11px;">🔴 ADMIN - Merchant Ad Add</div><input id="mName" class="input" placeholder="વેપારી નામ"><input id="mDetail" class="input" placeholder="Detail - Address/Mobile"><input id="mLink" class="input" placeholder="YouTube Link"><button class="btn btn-red" onclick="addMerchant()">➕ Merchant Ad Add કરો</button></div>

<div style="font-weight:bold;margin:8px 2px;">📢 વેપારી Ads</div>
<div id="adsList"></div>

<script>
let users=JSON.parse(localStorage.getItem('gte_users_v2')||'{}');
let cur=localStorage.getItem('gte_cur_v2');

function switchTab(t){document.getElementById('loginBox').classList.toggle('hidden',t!=='login');document.getElementById('signupBox').classList.toggle('hidden',t!=='signup');document.getElementById('tLogin').classList.toggle('active',t==='login');document.getElementById('tSignup').classList.toggle('active',t==='signup');}

function doSignup(){
let n=document.getElementById('sName').value.trim();
let m=document.getElementById('sMobile').value.trim().replace(/[^0-9]/g,'');
let p=document.getElementById('sPass').value.trim();
let r=document.getElementById('sRef').value.trim().replace(/[^0-9]/g,'');
if(!n||!m||!p){alert('નામ + Mobile + Password ભરો');return;}
if(m.length<10){alert('Mobile 10 આંકડા નો લખો');return;}
if(users[m]){alert('આ Mobile થી પહેલેથી ID છે! હવે Login કરો');switchTab('login');document.getElementById('loginId').value=m;return;}
users[m]={name:n,mobile:m,pass:p,refBy:r,team:[],join:new Date().toLocaleDateString()};
if(r && users[r]){users[r].team.push(m);}
localStorage.setItem('gte_users_v2',JSON.stringify(users));
alert('✅ SIGN UP SUCCESS!\\nID: '+m+'\\nહવે Login કરો');
switchTab('login');
document.getElementById('loginId').value=m;
document.getElementById('loginPass').value=p;
doLogin();
}

function doLogin(){
let id=document.getElementById('loginId').value.trim().replace(/[^0-9]/g,'');
let ps=document.getElementById('loginPass').value.trim();
if(!id||!ps){alert('ID + Password લખો');return;}
if(!users[id]){alert('❌ User નથી! પહેલા Sign Up કરો');switchTab('signup');return;}
if(users[id].pass!==ps){alert('❌ Password ખોટો!');return;}
cur=id;
localStorage.setItem('gte_cur_v2',cur);
showSuccess();
}

function showSuccess(){
if(!cur || !users[cur]) return;
let u=users[cur];
document.getElementById('authArea').classList.add('hidden');
document.getElementById('loginSuccess').classList.remove('hidden');
document.getElementById('welcomeMsg').innerHTML='Welcome <b>'+u.name+'</b><br>ID: '+u.mobile+' | Team: '+(u.team.length)+' members';
let base=window.location.origin+window.location.pathname;
let link=base+'?ref='+u.mobile;
document.getElementById('myRefLink').innerText=link;
document.getElementById('myTeam').innerHTML='<b>💰 Earnings:</b> Direct='+u.team.length+' x 25 = Rs.'+u.team.length*25+'<br><b>Members:</b> '+(u.team.join(', ')||'હજુ કોઈ નથી - Link Share કરો');
window.scrollTo(0,0);
loadAds();
}

function doLogout(){localStorage.removeItem('gte_cur_v2');cur=null;document.getElementById('loginSuccess').classList.add('hidden');document.getElementById('authArea').classList.remove('hidden');switchTab('login');}
function copyRef(){navigator.clipboard.writeText(document.getElementById('myRefLink').innerText).then(()=>alert('✅ Link Copy થયો!'));}
function shareWA(){let t=document.getElementById('myRefLink').innerText;window.open('https://wa.me/?text='+encodeURIComponent('*GREEN TASK EARN* Join: '+t),'_blank');}
function loadAds(){let ads=JSON.parse(localStorage.getItem('gt_merchant_ads')||'[]');if(ads.length==0)ads=[{name:'Happylife Channel - Mundra',id:'QrhsduEJNMg',detail:'Mundra Business'}];let cont=document.getElementById('adsList');cont.innerHTML='';ads.forEach(a=>{let det=a.detail||a.name;cont.innerHTML+=`<div class="ad-card"><img onclick="window.open('https://www.youtube.com/watch?v=${a.id}','_blank')" src="https://img.youtube.com/vi/${a.id}/hqdefault.jpg" style="width:100%;border-radius:6px;cursor:pointer;"><div style="font-size:12px;font-weight:bold;margin:6px 0;">🏪 ${a.name}</div><div style="font-size:10px;color:#555;margin-bottom:6px;">📝 ${det}</div><div style="display:flex;gap:6px;"><button class="btn btn-green" style="flex:1;padding:9px;" onclick="window.open('https://www.youtube.com/watch?v=${a.id}','_blank')">▶️ Video</button><button class="btn" style="flex:1;background:#2962ff;color:white;padding:9px;" onclick="alert('વેપારી: ${a.name}\\n${det}')">📞 Detail</button></div></div>`;});}
function extractID(u){let m=u.match(/(?:shorts\/|youtu\.be\/|watch\?v=|embed\/|v\/)([A-Za-z0-9_-]{6,15})/);return m?m[1]:''
