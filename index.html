<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Green Task - FIXED</title></head><body style="background:#f0f0f0;font-family:sans-serif;margin:0;padding:10px;">

<div style="background:#e8f5e9;padding:15px;border-radius:15px;text-align:center;">
  <div>વોલેટ ₹ <span id="walletBalance">0</span></div>
  <button onclick="if(confirm('બધી Ad કાઢી નાખવી?')){localStorage.removeItem('gt_merchant_ads');location.reload();}" style="background:black;color:white;padding:10px;border-radius:8px;margin-top:10px;">🗑️ બધી ખોટી Ad Delete કરો - RESET</button>
</div>

<div style="background:white;border:3px dashed red;border-radius:15px;padding:15px;margin:15px 0;">
  <h3 style="color:red;text-align:center;">ADMIN - નવી Ad ઉમેરો</h3>
  <input id="mName" placeholder="વેપારી નું નામ" style="width:100%;padding:12px;margin:5px 0;">
  <input id="mLink" placeholder="YouTube Link આખી Paste કરો" style="width:100%;padding:12px;margin:5px 0;">
  <input id="mPrice" placeholder="1000" type="number" style="width:100%;padding:12px;margin:5px 0;">
  <button onclick="addMerchant()" style="width:100%;background:red;color:white;padding:14px;border:none;border-radius:10px;">➕ Add કરો</button>
</div>

<div id="allAdsContainer"></div>

<script>
let ads = JSON.parse(localStorage.getItem('gt_merchant_ads')||'[]');
// જૂની ખોટી Ad Auto કાઢી નાખો
ads = ads.filter(a=>a.id && a.id.length>=6 && a.id.length<=15 && !a.id.match(/^[0-9]{10,}$/) && a.name);
if(ads.length==0){ads=[{name:'Happylife Channel - Mundra', id:'QrhsduEJNMg', price:1000}];}
localStorage.setItem('gt_merchant_ads', JSON.stringify(ads));

function extractID(url){
  let m = url.match(/(?:shorts\/|youtu\.be\/|watch\?v=|embed\/)([A-Za-z0-9_-]{6,15})/);
  return m ? m[1] : '';
}
function addMerchant(){
  let name=document.getElementById('mName').value.trim();
  let link=document.getElementById('mLink').value.trim();
  let price=document.getElementById('mPrice').value||1000;
  let id=extractID(link);
  if(!name||!id){alert('નામ અને સાચી YouTube Link નાખો! \nID ન મળી!');return;}
  ads.unshift({name:name,id:id,price:parseInt(price)});
  localStorage.setItem('gt_merchant_ads', JSON.stringify(ads));
  location.reload();
}
let container=document.getElementById('allAdsContainer');
ads.forEach((ad,i)=>{
  container.innerHTML+=`<div style="background:white;border:3px solid green;border-radius:15px;padding:15px;margin:10px 0;text-align:center;">
  <img onclick="window.open('https://www.youtube.com/watch?v=${ad.id}','_blank')" src="https://img.youtube.com/vi/${ad.id}/hqdefault.jpg" style="width:100%;border-radius:12px;cursor:pointer;">
  <div style="font-weight:bold;margin:10px 0;text-align:left;">🏪 ${ad.name} - ₹${ad.price}</div>
  <button style="width:100%;background:#25D366;color:white;padding:14px;border:none;border-radius:10px;">▶️ Video જુઓ</button>
  </div>`;
});
</script>
</body></html>
