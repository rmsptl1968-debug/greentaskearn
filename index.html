<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Task Earn - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f0f5f0}
.header{background:linear-gradient(90deg,#0a7a00,#25D366);padding:15px;text-align:center;color:white;border-radius:0 0 15px 15px}
.header h1{font-size:26px;letter-spacing:1px}
.card{background:white;margin:12px;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:6px 0}
.btn-green{background:#25D366;color:white}
.btn-red{background:red;color:white}
.btn-dark{background:#222;color:white}
.input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
.tabs{display:flex;gap:8px;margin:10px}
.tab{flex:1;padding:10px;text-align:center;background:#e0e0e0;border-radius:8px;cursor:pointer;font-weight:bold}
.tab.active{background:#25D366;color:white}
.hidden{display:none}
.level-box{background:#f0fff0;border-left:4px solid #25D366;padding:8px;margin:6px 0;border-radius:6px;font-size:13px}
.ref-box{background:#fff3cd;border:2px dashed #ff9800;padding:10px;border-radius:8px;word-break:break-all;font-size:12px;margin:8px 0}
</style></head><body>

<div class="header">
<h1>GREEN TASK EARN</h1>
<p style="font-size:12px;margin-top:4px;">100% LEGAL | MSME | Rs.201 STARTER PLAN</p>
</div>

<div id="authSection">
<div class="tabs">
<div class="tab active" id="tabLogin" onclick="switchTab('login')">Login</div>
<div class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
</div>

<div id="loginBox" class="card">
<h3 style="text-align:center;color:green;">🔐 Member Login</h3>
<input id="loginId" class="input" placeholder="Mobile No / User ID">
<input id="loginPass" type="password" class="input" placeholder="Password">
<button class="btn btn-green" onclick="doLogin()">Login કરો</button>
</div>

<div id="signupBox" class="card hidden">
<h3 style="text-align:center;color:green;">📝 New Member Sign Up</h3>
<input id="sName" class="input" placeholder="તમારું નામ">
<input id="sMobile" class="input" placeholder="Mobile No (આ જ તમારી ID બનશે)">
<input id="sPass" type="password" class="input" placeholder="Password બનાવો">
<input id="sRef" class="input" placeholder="Referral Code (જો હોય તો)">
<div style="font-size:11px;background:#e8f5e9;padding:8px;border-radius:6px;margin:6px 0;">Rs.201 Plan: L1=25, L2=20, L3=40 Super, L4=20, L5=20</div>
<button class="btn btn-green" onclick="doSignup()">Sign Up + Join Rs.201 Plan</button>
</div>
</div>

<div id="dashSection" class="hidden">
<div class="card">
<h3 id="welcomeText">Welcome!</h3>
<p style="font-size:12px;color:#666;" id="userInfo"></p>
<button class="btn btn-dark" style="padding:8px;margin-top:8px;" onclick="doLogout()">Logout</button>
</div>

<div class="card">
<h3 style="color:green;">🔗 તમારી Refer Link</h3>
<div class="ref-box" id="refLinkBox"></div>
<button class="btn btn-green" onclick="copyRef()" style="padding:8px;">📋 Link Copy કરો</button>
<button class="btn" style="background:#25D366;color:white;padding:10px;margin-top:6px;" onclick="shareWA()">WhatsApp Share</button>
</div>

<div class="card">
<h3 style="color:green;">💰 મારી Team (5 Level)</h3>
<div id="teamStats"></div>
</div>

<div class="card" style="border:2px dashed red;">
<h3 style="color:red;text-align:center;font-size:14px;">🔴 ADMIN - Merchant Ad Add</h3>
<input id="mName" class="input" placeholder="વેપારી નામ">
<input id="mLink" class="input" placeholder="YouTube Link">
<button class="btn btn-red" onclick="addMerchant()">➕ Merchant Ad Add કરો</button>
</div>

<div class="card">
<h3>📢 વેપારી Ads</h3>
<div id="allAdsContainer"></div>
</div>
</div>

<script>
let users=JSON.parse(localStorage.getItem('gte_users')||'{}');
let currentUser=JSON.parse(localStorage.getItem('gte_current')||'null');
function switchTab(t){document.getElementById('loginBox').classList.toggle('hidden',t!=='login');document.getElementById('signupBox').classList.toggle('hidden',t!=='signup');document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabSignup').classList.toggle('active',t==='signup');}
function doSignup(){let name=document.getElementById('sName').value.trim();let mobile=document.getElementById('sMobile').value.trim();let pass=document.getElementById('sPass').value.trim();let ref=document.getElementById('sRef').value.trim().toUpperCase();if(!name||!mobile||!pass){alert('બધા Field ભરો');return;}if(users[mobile]){alert('Account પહેલેથી છે! Login કરો');switchTab('login');return;}let user={name:name,mobile:mobile,pass:pass,refBy:ref||'',joinDate:new Date().toLocaleDateString(),team:[]};users[mobile]=user;if(ref&&users[ref]){users[ref].team.push(mobile);}localStorage.setItem('gte_users',JSON.stringify(users));alert('Success! ID: '+mobile);switchTab('login');}
function doLogin(){let id=document.getElementById('loginId').value.trim();let pass=document.getElementById('loginPass').value.trim();if(!users[id]){alert('User નથી! Sign Up કરો');return;}if(users[id].pass!==pass){alert('Password ખોટો');return;}currentUser=id;localStorage.setItem('gte_current',JSON.stringify(currentUser));showDash();}
function doLogout(){localStorage.removeItem('gte_current');currentUser=null;document.getElementById('authSection').classList.remove('hidden');document.getElementById('dashSection').classList.add('hidden');}
function showDash(){if(!currentUser)return;let u=users[currentUser];document.getElementById('authSection').classList.add('hidden');document.getElementById('dashSection').classList.remove('hidden');document.getElementById('welcomeText').innerText='Welcome, '+u.name+'!';document.getElementById('userInfo').innerText='ID: '+u.mobile+' | Join: '+u.joinDate+' | Refer By: '+(u.refBy||'Direct');let baseUrl=window.location.origin+window.location.pathname;let refLink=baseUrl+'?ref='+u.mobile;document.getElementById('refLinkBox').innerText=refLink;let direct=u.team?u.team.length:0;document.getElementById('teamStats').innerHTML=`<div class="level-box">Level 1 (Direct) = ${direct} Members = Rs.${direct*25}</div><div class="level-box">Level 2 = Rs.20 per member</div><div class="level-box" style="border-left-color:red;background:#fff0f0;"><b>Level 3 = Super Promoter = Rs.40</b></div><div class="level-box">Level 4=20 | Level5=20</div><div style="font-size:11px;margin-top:6px;">Direct: ${(u.team||[]).join(', ')||'હજુ કોઈ નથી'}</div>`;loadAds();}
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLinkBox').innerText).then(()=>alert('Link Copy થયો!'));}
function shareWA(){let t=document.getElementById('refLinkBox').innerText;let msg=`*GREEN TASK EARN Rs.201 Plan*%0AJoin: ${encodeURIComponent(t)}`;window.open('https://wa.me/?text='+msg,'_blank');}
function loadAds(){let ads=JSON.parse(localStorage.getItem('gt_merchant_ads')||'[]');if(ads.length==0){ads=[{name:'Happylife Channel - Mundra',id:'QrhsduEJNMg'}];}let c=document.getElementById('allAdsContainer');c.innerHTML='';ads.forEach(a=>{c.innerHTML+=`<div style='background:white;border:2px solid #25D366;border-radius:12px;padding:10px;margin:8px 0;text-align:center;'><img src='https://img.youtube.com/vi/${a.id}/hqdefault.jpg' style='width:100%;border-radius:8px;'><div style='font-weight:bold;margin:6px 0;text-align:left;font-size:13px;'>🏪 ${a.name}</div><button onclick="window.open('https://www.youtube.com/watch?v=${a.id}','_blank')" style='width:100%;background:#25D366;color:white;padding:10px;border:none;border-radius:6px;'>▶️ Video જુઓ</button></div>`;});}
function extractID(u){let m=u.match(/(?:shorts\/|youtu\.be\/|watch\?v=|embed\/|v\/)([A-Za-z0-9_-]{6,15})/);return m?m[1]:'';}
function addMerchant(){let n=document.getElementById('mName').value.trim();let l=document.getElementById('mLink').value.trim();let id=extractID(l);if(!n||!id){alert('નામ+Link');return;}let ads=JSON.parse(localStorage.getItem('gt_merchant_ads')||'[]');ads.unshift({name:n,id:id});localStorage.setItem('gt_merchant_ads',JSON.stringify(ads));loadAds();}
window.onload=function(){let params=new URLSearchParams(window.location.search);let ref=params.get('ref');if(ref){document.getElementById('sRef').value=ref;switchTab('signup');}let saved=localStorage.getItem('gte_current');if(saved){currentUser=JSON.parse(saved);showDash();}}
</script>
</body></html>
