<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Task Earn</title>
<style>body{margin:0;font-family:Arial;background:#e8f5e9;text-align:center}header{background:#2e7d32;color:#fff;padding:30px}h1{margin:0}.box{background:#fff;margin:20px;padding:20px;border-radius:12px;box-shadow:0 2px 8px #ccc}button{background:#2e7d32;color:#fff;border:0;padding:12px 25px;border-radius:8px;font-size:16px}input{padding:10px;width:80%;margin:10px;border:1px solid #ccc;border-radius:8px}</style></head>
<body><header><h1>🌿 Green Task Earn</h1><p>Task કરો - Point કમાઓ - પૈસા કમાઓ</p></header>
<div class="box"><h2>Welcome!</h2><p>તમારું Balance: <b id="bal">0</b> Points</p><input id="name" placeholder="તમારું નામ લખો"><br><button onclick="add()">Daily Task પૂરો કરો +10</button></div>
<div class="box"><h3>Tasks</h3><p>✅ Video જુઓ - 10 Points</p><p>✅ App ડાઉનલોડ કરો - 20 Points</p><p>✅ મિત્રને Share કરો - 30 Points</p></div>
<script>let b=0;function add(){b+=10;document.getElementById('bal').innerText=b;alert('બધાઈ! +10 Points મળ્યા');}</script>
</body></html>
