<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenTaskEarn V7.3 FULL - INR ₹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial}
body{background:#e8f5e9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:420px;border-radius:28px;padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.12);text-align:center}
.logo{width:80px;height:80px;background:#16a34a;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:48px}
h1{color:#14532d;font-size:28px;font-weight:800}
.sub{color:#16a34a;font-weight:700;font-size:18px}
.small{color:#777;font-size:14px;margin:6px 0 20px}
input{width:100%;padding:14px 16px;border:1.5px solid #d1d5db;border-radius:12px;margin-bottom:12px;font-size:16px;outline:none}
input:focus{border-color:#16a34a}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:12px}
.btn-green{background:#16a34a;color:white}
.btn-outline{background:white;color:#16a34a;border:2px solid #16a34a}
.info{background:#f0fdf4;padding:12px;border-radius:12px;text-align:left;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="card" id="loginCard">
<div class="logo">🌱</div>
<h1>GreenTaskEarn</h1>
<div class="sub">V7.3 FULL - INR ₹</div>
<div class="small">Refer | Ad | Tree | QR</div>
<input id="email" type="email" placeholder="Email" value="admin@greentaskearn.com">
<input id="pass" type="password" placeholder="Password" value="admin123">
<button class="btn btn-green" onclick="doLogin()">Login</button>
<button class="btn btn-outline" onclick="doRegister()">Register</button>
<div class="info"><b>Admin:</b> admin@greentaskearn.com<br>admin123</div>
<div id="msg" style="margin-top:10px;color:red;font-size:14px"></div>
</div>

<div class="card" id="dash" style="display:none">
<h2>🌳 Welcome, <span id="userName">Admin</span>!</h2>
<p style="margin:20px 0">Balance: <b style="color:#16a34a;font-size:28px">₹ <span id="bal">1250</span></b></p>
<button class="btn btn-green" style="margin-top:10px" onclick="earn(50)">📺 Watch Ad - ₹50</button>
<button class="btn btn-green" onclick="earn(100)">🌲 Plant Tree - ₹100</button>
<button class="btn btn-green" onclick="earn(25)">🔗 Refer - ₹25</button>
<button class="btn btn-green" onclick="earn(30)">📱 QR Task - ₹30</button>
<button class="btn btn-outline" onclick="logout()" style="margin-top:20px">Logout</button>
</div>

<script>
let users = JSON.parse(localStorage.getItem('gte_users') || '[]');
if(!users.find(u=>u.email==='admin@greentaskearn.com')){
  users.push({email:'admin@greentaskearn.com',pass:'admin123',name:'Admin',bal:1250});
  localStorage.setItem('gte_users', JSON.stringify(users));
}
function doLogin(){
  const e=document.getElementById('email').value.trim().toLowerCase();
  const p=document.getElementById('pass').value.trim();
  const msg=document.getElementById('msg');
  if(!e||!p){msg.textContent='Email અને Password લખો';return;}
  let u=users.find(x=>x.email.toLowerCase()===e && x.pass===p);
  if(u){localStorage.setItem('gte_current',JSON.stringify(u));showDash(u);}
  else{msg.textContent='ખોટો Email/Password! admin@greentaskearn.com / admin123 વાપરો';}
}
function doRegister(){
  const e=document.getElementById('email').value.trim().toLowerCase();
  const p=document.getElementById('pass').value.trim();
  const msg=document.getElementById('msg');
  if(!e||!p){msg.textContent='Email અને Password લખો';return;}
  if(users.find(x=>x.email.toLowerCase()===e)){msg.textContent='પહેલાથી Register છે, Login કરો';return;}
  let nu={email:e,pass:p,name:e.split('@')[0],bal:100};
  users.push(nu);localStorage.setItem('gte_users',JSON.stringify(users));
  msg.style.color='green';msg.textContent='Register થઈ ગયું! હવે Login કરો';
  setTimeout(()=>{msg.style.color='red';},2000);
}
function showDash(u){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('dash').style.display='block';
  document.getElementById('userName').textContent=u.name;
  document.getElementById('bal').textContent=u.bal;
}
function earn(amt){
  let cur=JSON.parse(localStorage.getItem('gte_current'));
  cur.bal=(cur.bal||0)+amt;
  users=users.map(x=>x.email===cur.email?cur:x);
  localStorage.setItem('gte_users',JSON.stringify(users));
  localStorage.setItem('gte_current',JSON.stringify(cur));
  document.getElementById('bal').textContent=cur.bal;
  alert('₹'+amt+' મળ્યા! Balance: ₹'+cur.bal);
}
function logout(){localStorage.removeItem('gte_current');location.reload();}
let cur=localStorage.getItem('gte_current');
if(cur){try{showDash(JSON.parse(cur));}catch(e){}}
</script>
</body>
</html>
