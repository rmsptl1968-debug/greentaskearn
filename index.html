<script>let ads=JSON.parse(localStorage.getItem('gt_merchant_ads')||'[]');if(ads.length==0){ads=[{name:'Happylife Channel',id:'QrhsduEJNMg'}];}function extractID(u){let m=u.match(/(?:shorts\/|youtu\.be\/|watch\?v=|embed\/|v\/)([A-Za-z0-9_-]{6,15})/);return m?m[1]:'';}function addMerchant(){let n=document.getElementById('mName').value.trim();let l=document.getElementById('mLink').value.trim();let id=extractID(l);if(!n||!id){alert('નામ+Link');return;}ads.unshift({name:n,id:id});localStorage.setItem('gt_merchant_ads',JSON.stringify(ads));location.reload();}let c=document.getElementById('allAdsContainer');ads.forEach(a=>{c.innerHTML+=`<div style='background:white;border:3px solid #25D366;border-radius:15px;padding:15px;margin:10px;text-align:center;'><img src='https://img.youtube.com/vi/${a.id}/hqdefault.jpg' style='width:100%;border-radius:12px;'><div>🏪 ${a.name}</div><button onclick="window.open('https://www.youtube.com/watch?v=${a.id}','_blank')" style='width:100%;background:#25D366;color:white;padding:10px;border:none;border-radius:8px;'>▶️ Video</button></div>`;});</script></body></html>
