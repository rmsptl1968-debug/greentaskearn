<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Merchant Panel</title><style>body{font-family:Arial;background:#fffbeb;padding:15px}.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:14px;background:#f59e0b;border:none;border-radius:8px;font-size:16px;margin-top:10px}textarea{width:100%;height:100px}</style></head>
<body><div class="card"><h2>Merchant - Video Ad</h2>
<input id="name" placeholder="દુકાન નું નામ">
<input id="video" placeholder="YouTube / Drive Video Link">
<input id="rate" type="number" placeholder="1 View = ₹ (1)">
<input id="total" type="number" placeholder="કુલ View (1000)">
<button onclick="makeAd()">Ad બનાવો</button>
<textarea id="out" readonly placeholder="અહીં Code આવશે..."></textarea>
<button onclick="copyAd()" style="background:#16a34a;color:white">📋 Copy કરી ને ads.json માં મૂકો</button>
<p id="msg" style="color:green;font-weight:bold"></p>
<p style="font-size:12px">1. ઉપર ભરો 2. Ad બનાવો 3. Copy દબાવો 4. Github માં ads.json માં Paste કરી Commit કરો. બસ! બધા ને Video Ad દેખાશે!</p></div>
<script>
function makeAd(){
 let n=document.getElementById("name").value, v=document.getElementById("video").value, r=document.getElementById("rate").value||1, t=document.getElementById("total").value||1000;
 if(!n||!v) return alert("નામ અને Video Link ભરો!");
 // YouTube link ને Embed માં બદલો
 if(v.includes("youtube.com/watch")) v=v.replace("watch?v=","embed/");
 if(v.includes("youtu.be/")) v=v.replace("youtu.be/","www.youtube.com/embed/");
 let json=`[{"name":"${n}","video":"${v}","rate":${r},"total":${t},"remaining":${t}}]`;
 document.getElementById("out").value=json;
}
function copyAd(){
 let t=document.getElementById("out"); if(!t.value) return alert("પહેલા Ad બનાવો!");
 t.select(); navigator.clipboard.writeText(t.value);
 document.getElementById("msg").innerText="✅ Copy થઈ ગયું! હવે ads.json માં Paste કરો!";
}
</script></body></html>
